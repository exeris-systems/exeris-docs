name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time. `synchronize` fires on every push, so without this a
# quick follow-up push leaves two full reviews running against different commits —
# the older one finishes and posts a verdict on code that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts and dependency bumps do not need a full review pass. Draft PRs still
    # fire `opened`, and a bot PR would otherwise be reviewed once per push.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR. The repo is `exeris-docs` — the central documentation
            hub for the Exeris Systems ecosystem (Markdown only): the single-namespace
            ADR registry, platform-scope ADRs, the High-Level Architecture, the B2B
            whitepaper, decision-document templates, and execution-plan trails. It is
            NOT a monorepo and ships no code. Read `AGENTS.md` before reviewing; it
            is the entry point, and the detailed rules live under `.agents/` — read the
            ones your diff touches rather than working from memory.

            Focus on:
            1. **Correctness & merge hygiene** — broken intra-repo links and anchors,
               dangling `ADR-NNN.link.md` references, merge artifacts (duplicated
               sections, orphan blocks), malformed Markdown tables.
            2. **Scope** — does the diff match the PR title/description? Anything in
               scope that's missing, or out of scope that should be split?
            3. **ADR registry conventions** — if the PR adds/changes an ADR: number
               reserved in `adr-index.md` first; filename `ADR-NNN-<lowercase-kebab>.md`
               (3-digit, `&`→`and`); correct authoritative location for scope;
               visibility is two-valued (`public` / `enterprise-private`, never the
               deprecated `public-staged`); license taxonomy (`community` /
               `commercial` / `enterprise-private`) kept distinct from visibility.
            4. **Doc precedence & consistency** — when a claim changes, is every site
               updated (registry + HLA + whitepaper)? Does it respect the precedence
               order (subsystem doc > ADR > HLA > whitepaper)? Flag single-edit changes
               that leave the rest of the corpus inconsistent.
            5. **Three-tier integrity & drift** — open
               `.agents/policies/drift-patterns.md` and sweep the edited files for every
               pattern it lists. Read the file; do not work from a remembered subset. It
               is the single owner of that list, and a copy of it here would go stale the
               next time a pattern is added — as an earlier copy did, missing the three
               patterns that carry withdrawn figures. State "none" if clean; don't pad.
            6. **Scoped bans** — `.agents/policies/adr-registry.md` and the Scoped bans
               section of `AGENTS.md` are absolute. A withdrawn figure asserted rather
               than fenced, and any number without a report path and a figure state, are
               blockers regardless of how small the diff is.

            Skip cosmetic nits unless they affect the above. Be specific: cite
            `file:line`. Lead with blockers, then in-scope improvements, then
            non-blocking suggestions. End with a clear verdict
            (LGTM / Approve with nits / Request changes).

            Post your review as a single PR review (not many separate comments).
            Use inline comments only when they materially help — file:line in the
            text body is usually clearer.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git branch:*),Bash(git remote:*)"
