# Composition and delivery metadata for this repository's agent material.
# agents-md-schema.md rules 5, 7, 8 and 12: profiles and workflows compose by reference, provider
# directories are generated, imports are version-pinned, and what a vendor cannot do is written
# down rather than assumed.
#
# The check asserts this file and the filesystem agree in BOTH directions: every name here exists,
# and every profile, skill and workflow on disk is named here. A file that exists but is not
# listed is the failure this key ordering is meant to catch.
version: 2
repository: exeris-docs

# The organisation bundle does not exist as a published artefact yet, so there is nothing to pin.
# A floating import would be a rule-8 violation, not a shortcut.
imports: []

agents:
  - exeris-docs-router
  - exeris-docs-architect
  - exeris-docs-adr-registry-keeper
  - exeris-docs-document-shape-classifier
  - exeris-docs-implementer
  - exeris-docs-evaluator
# Not adopted here: a security role. The plan justifies one by the substrate it reviews — Panama
# FFM downcalls, Arena lifetimes, off-heap ownership — and this repository ships no code at all.
# It belongs in exeris-kernel, and adding an idle persona here would cost a routing entry and a
# context window to review Markdown.

skills:
  - exeris-docs-adr-registry-discipline-review
  - exeris-docs-document-shape-classifier
  - exeris-docs-drift-pattern-sweep-review
  - exeris-docs-routing-planner
  - exeris-docs-task-classifier
  - exeris-docs-three-tier-narrative-review

workflows:
  - adr-reservation-check
  - docs-pr-review
  - drift-pattern-sweep
  - three-tier-narrative-purity
  - visibility-taxonomy-check

policies:
  - adr-registry
  - editing-large-documents
  - drift-patterns
  - agent-safety-and-autonomy
  - error-handling-and-fallback

references:
  - three-tier-architecture
  - capability-layer
  - graph-subsystem
  - bootstrap-dag

schemas:
  - triage-result
  - verdict
  - handoff

hooks: hooks/hooks.yaml
evals: evals/scenarios.yaml

# No nested AGENTS.md: this repository has no subtree with materially different constraints.
# `standards/` and `adr/` are governed by the same rules the root file names.
nested: []

scripts:
  # Plain shell, provider-agnostic: they read this repository's Markdown and locate candidates.
  # They live here rather than under a provider directory because several skills, profiles and
  # workflows call them, and a canonical file must not depend on an adapter (rules 2 and 7).
  - scripts/drift-sweep.sh
  - scripts/adr-filename-check.sh
  - scripts/taxonomy-check.sh
  - scripts/check-consistency.sh

renderer:
  # One implementation, shared across repositories (ADR-085 §C.11). A repository that renders with
  # its own script is a fork of the standard and drifts from it — which is exactly what this
  # repository did while it had none.
  source: exeris-systems/.github
  entrypoint: scripts/agents_render.py
  check: scripts/agents_file_check.py

adapters:
  claude:
    target: .claude
    agents: .claude/agents/{name}.md
    skills: symlink                       # .claude/skills -> ../.agents/skills
    workflows: .claude/skills/{name}/SKILL.md   # `commands/` is the legacy flat-file form
    hooks: .claude/settings.json#hooks
  copilot:
    target: .github
    agents: .github/agents/{name}.agent.md
    skills: native                        # Copilot reads .agents/skills directly
    workflows: .github/prompts/{name}.prompt.md
    hooks: .github/hooks/exeris.json
    # Deferred with the other four, and for a stated reason: a Copilot adapter needs a mapping of
    # capabilities onto that runtime's tool names, and one written from memory would silently
    # grant or withhold tools. The mapping file is the deliverable, not the adapter.
    status: deferred
  codex:
    target: .codex
    skills: native
    hooks: .codex/hooks.json
    status: deferred                      # plan Phase 5; no adapter written yet
  gemini:
    target: .gemini
    skills: native
    status: deferred
  antigravity:
    target: .agents
    skills: native
    hooks: .agents/hooks.json             # RENDERED, never authored — see rule 2
    status: deferred
  cursor:
    target: .cursor
    skills: native
    status: deferred

degradations:
  # What each runtime cannot do. An unrecorded degradation is an operator believing a gate runs
  # on a client that never had it.
  copilot: [stop-hook-warn-only]
  gemini: [stop-hook-warn-only, no-agent-scoped-hooks]
  cursor: [stop-hook-warn-only]
  antigravity:
    - stop-hook-warn-only
    # Measured 2026-09-08 on agy 1.1.27: `--agent <name>` runs the turn with the default agent and
    # exits 0 when the name does not resolve, and `agy agents` lists nothing for a repository
    # profile. Automation that selects an agent on this runtime must assert the profile was
    # applied; the exit code does not.
    - agent-selection-fails-silently
  windows:
    # .claude/skills is a symlink. A checkout without Developer Mode needs the copy fallback.
    - skills-symlink-needs-copy-fallback

provider-owned:
  # Operational configuration, exempt from the generated-marker check by this list rather than by
  # a regex (rule 7).
  - .claude/settings.local.json
  - .claude/README.md
  - .github/workflows/
