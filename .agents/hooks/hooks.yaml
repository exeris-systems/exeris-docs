# Canonical hook definitions — the L0 layer of ADR-085 §J, authored once here and rendered to each
# vendor's hook file by the shared renderer. agents-md-schema.md rule 12.
#
# This file is read at runtime by bin/hook.py, so it is the implementation and not a description of
# one. A pattern changed here changes behaviour on every vendor; a pattern changed in a rendered
# file is overwritten on the next render.
#
# Two shapes only, and the difference is the whole design:
#   deny            — the action is one no policy permits. Refuse it.
#   record + gate   — the action is one policy permits *with a consequence*. Allow it, write down
#                     that it happened, and block the stop until the consequence is discharged.
# Denying what a policy allows produces a hook that is switched off within a week.
version: 1

state-dir: .agents-state          # git-ignored; the dispatcher keys a subdirectory per
                                  # session, so a check run in one session discharges
                                  # nothing in the next

hooks:
  # ── deny ────────────────────────────────────────────────────────────────────────────────────
  - id: deny-irreversible
    event: pre-tool
    tool: shell
    decision: deny
    reason: >-
      agent-safety-and-autonomy.md §1 (shared bundle policy, vendored under .agents/vendor/):
      irreversible or outward-facing action.
      The founder asks for these in the session they happen in.
    # Ordinary `git push` of a feature branch is deliberately absent: it is reversible, it is how
    # a pull request is opened, and denying it would make the hook the thing people disable.
    match:
      # Force. `--force-with-lease` is deliberately absent: it refuses when anyone else has
      # pushed, and denying it would forbid rewriting an unreviewed commit message on one's own
      # branch — the rule people learn to route around. Bare `--force`, `-f` and bundled short
      # forms (`-fu`, `-uf`) have no such guard.
      - 'git\s+push\b[^|;&]*(--force(?!-with-lease)|--mirror|\s-[a-zA-Z]*f[a-zA-Z]*(\s|$))'
      # Protected refs, in every spelling git accepts: bare name, refspec, forced refspec, and
      # --all/--tags which push them without naming them.
      - 'git\s+push\b[^|;&]*\s\+?(main|master|development/\S+)(\s|$)'
      - 'git\s+push\b[^|;&]*\s\+?[^\s:]*:(refs/heads/)?(main|master|development/)'
      - 'git\s+push\b[^|;&]*\s--(all|tags)\b'
      - 'git\s+push\b[^|;&]*--delete\b'
      # Tag CREATION only. `-l`, `--list`, `-n`, `--contains`, `-v` are read-only and denying them
      # is the over-block this file's own header warns about.
      - 'git\s+tag\s+(?!-(l|-list|n\d*|-contains|-no-contains|v|-verify|-points-at|-merged|-no-merged)\b)(-[a-zA-Z]+\s+)*\S'
      - 'git\s+branch\s+-[dD]\b'
      - 'git\s+reset\s+--hard\b'
      - 'git\s+clean\s+-[a-zA-Z]*[fd][a-zA-Z]*\b'
      - 'git\s+worktree\s+remove\b'
      # Publish and deploy, which agent-safety-and-autonomy.md §1 names and this list did not.
      - '(^|[|;&]\s*)npm\s+(publish|unpublish|deprecate)\b'
      - '(^|[|;&]\s*)(yarn|pnpm)\s+publish\b'
      - 'mvn\b[^|;&]*\s(deploy|release:(prepare|perform))\b'
      - '(^|[|;&]\s*)docker\s+push\b'
      - '(^|[|;&]\s*)gh\s+release\s+(create|delete|upload)\b'
      - '(^|[|;&]\s*)gh\s+pr\s+(merge|close)\b'
      # Repository lifecycle and visibility — irreversible, and outward-facing.
      - '(^|[|;&]\s*)gh\s+repo\s+(delete|archive|rename)\b'
      - '(^|[|;&]\s*)gh\s+repo\s+edit\b[^|;&]*--visibility\b'

  # ── record ──────────────────────────────────────────────────────────────────────────────────
  - id: record-guardrail-run
    event: post-tool
    tool: shell
    decision: allow
    # Records that a mechanical check actually ran. The patterns are anchored to a command
    # POSITION — start of line, or after a pipe, `&&`, `;` or `$(` — because a bare substring
    # match let `echo adr-filename-check.sh` discharge the stop gate. The dispatcher additionally
    # refuses to record a call the runtime reported as failed: a check that ran and failed has
    # discharged nothing.
    match:
      - '(?:^|[|;&]\s*|\$\(\s*)(?:\S*/)?adr-filename-check\.sh\b'
      - '(?:^|[|;&]\s*|\$\(\s*)(?:\S*/)?drift-sweep\.sh\b'
      - '(?:^|[|;&]\s*|\$\(\s*)(?:\S*/)?taxonomy-check\.sh\b'
      - '(?:^|[|;&]\s*|\$\(\s*)(?:\S*/)?check-consistency\.sh\b'
      - '(?:^|[|;&]\s*|\$\(\s*)(?:python3?\s+)?(?:\S*/)?agents_file_check\.py\b'
      - '(?:^|[|;&]\s*|\$\(\s*)(?:python3?\s+)?(?:\S*/)?frontmatter_check\.py\b'
      - '(?:^|[|;&]\s*|\$\(\s*)(?:python3?\s+)?(?:\S*/)?registry_check\.py\b'
    record: guardrails-run

  - id: record-record-edit
    event: post-tool
    tool: edit
    decision: allow
    paths:
      - 'adr/ADR-*.md'
      - 'adr-index.md'
      - 'high-level-architecture.md'
      - 'b2b-technical-whitepaper.md'
      - 'standards/*.md'
      - '.agents/**'
      - 'AGENTS.md'
    record: docs-edited

  # ── gate ────────────────────────────────────────────────────────────────────────────────────
  - id: guardrails-gate-on-stop
    event: stop
    decision: block-or-allow
    degrade: warn                 # only Claude Code and Codex document a blockable stop
    # Each rule: if <edited> matched something and <requires> never ran, the session may not finish.
    rules:
      - when-edited: ['adr/ADR-*.md', 'adr-index.md']
        requires: ['adr-filename-check.sh']
        reason: >-
          .agents/policies/adr-registry.md: an ADR touched without adr-filename-check.sh — the
          number must be reserved in adr-index.md before the content file lands, and the filename
          must match ADR-NNN-<lowercase-kebab-title>.md.
      - when-edited: ['high-level-architecture.md', 'b2b-technical-whitepaper.md']
        requires: ['drift-sweep.sh']
        reason: >-
          .agents/policies/editing-large-documents.md: a large document edited without a
          drift-pattern sweep. Run .agents/scripts/drift-sweep.sh on each edited file and
          adjudicate the candidates.
      - when-edited: ['.agents/**', 'AGENTS.md']
        requires: ['agents_file_check.py']
        reason: >-
          standards/agents-md-schema.md: the agent layer changed without the agent-file check.
          Run it, and regenerate the adapters rather than editing them.
